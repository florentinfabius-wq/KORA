<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion Kora</title><style>body{font-family:Arial;margin:0;background:#f4f7f5;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:16px;width:min(420px,92%);box-shadow:0 8px 30px #0001}h1{color:#008751}input,button{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ddd;font:inherit}button{background:#008751;color:#fff;font-weight:800;cursor:pointer}.msg{padding:10px;border-radius:8px;background:#fff8d8;margin-top:8px}a{color:#008751}@media(max-width:520px){body{padding:12px;min-height:100dvh}.box{width:100%;max-width:430px;padding:22px;border-radius:14px}h1{font-size:25px;margin-top:0}h2{font-size:21px}input,button{padding:13px 12px;margin:7px 0}.msg{word-break:break-word}}</style></head><body><div class="box"><h1>Kora 🇧🇯</h1><h2>Connexion</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="go()">Se connecter</button><div id="msg"></div><p>Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p></div><script>async function go(){try{const r=await fetch("/api/users/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:pass.value})});const d=await r.json();if(!r.ok)throw Error(d.detail);localStorage.setItem("koraUser",JSON.stringify(d.user));localStorage.setItem("koraLoggedIn","true");location.href="index.html"}catch(e){msg.textContent=e.message}}</script></body></html>
